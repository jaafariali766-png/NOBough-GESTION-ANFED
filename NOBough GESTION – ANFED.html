#loading{padding:30px;text-align:center;color:var(--mut)}
</style>

<header>

  <img id="hlogo" alt="" style="display:none">
  <div class="ti"><b id="hname">جمعية نبوغ للتكوين والتربية الرقمية</b><small>NOBough GESTION – ANFED</small></div>
</header>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
"use strict";
/* ============ أدوات عامة ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const J=a=>a.join('');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=d=>{if(!d)return '';const[y,m,dd]=String(d).slice(0,10).split('-');return `${dd}/${m}/${y}`};
const MAD=n=>(Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' د.م.';
const N0=n=>(Number(n)||0).toLocaleString('fr-FR');
const sum=(a,f)=>a.reduce((s,x)=>s+(Number(f(x))||0),0);
const byDate=(a,b)=>(a.date||'').localeCompare(b.date||'');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const MONTHS=['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر'];
const PAL=['#0f4c5c','#e09f3e','#1b8a5a','#9a348e','#d1495b','#3d7ea6','#7a8b99','#b5651d','#5c946e'];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
const cap=n=>(window.claude&&claude.use)?claude.use(n).catch(()=>null):Promise.resolve(null);

/* ============ الإعدادات الافتراضية ============ */
const CFG0={name:'جمعية نبوغ للتكوين والتربية الرقمية',fr:'Association Noubogh for Education and Digital Training',addr:'',email:'',tel:'',recepisse:'',bank:'',logo:'',primary:'#0f4c5c',accent:'#e09f3e',fy:new Date().getFullYear(),opening:0,fee:0,prefix:'NB',hdr:'',ftr:'',sigP:'',sigT:'',sigS:'',sigImg:'',goals:'',secret:''};
const CATS0={resNat:['اشتراكات','منح','دعم','شراكات','تبرعات','مساهمات','مداخيل الأنشطة','موارد أخرى'],
depType:['تسيير إداري','تجهيزات ولوازم','تنقل وإيواء','إطعام وضيافة','طباعة واتصال','تكوين وتأطير','مصاريف بنكية','مصاريف أخرى'],
domains:['التربية والتكوين','التكنولوجيا والرقمنة','الذكاء الاصطناعي','التربية على المواطنة','البيئة والتنمية المستدامة','دعم التمدرس','الأنشطة الثقافية والفنية','تمكين النساء والشباب','مجالات أخرى'],
payM:['نقداً','تحويل بنكي','شيك'],memT:['منخرط','عضو مؤسس','عضو شرف','عضو مكتب'],
actT:['ورشة','دورة تكوينية','ندوة','لقاء تواصلي','حملة تحسيسية','نشاط ثقافي/فني','اجتماع','جمع عام','أخرى'],
docCat:['تقارير مالية وأدبية','محاضر الاجتماعات والجمع العام','اتفاقيات وشراكات','فواتير ووصولات','ملفات المشاريع','لوائح المنخرطين','صور الأنشطة','مراسلات إدارية','أخرى']};
const PRJ_ST=['قيد الإعداد','جارٍ','مكتمل','متوقف'];
const ROLES={president:'الرئيس',admin:'مسؤول النظام',treasurer:'الأمين',secretary:'الكاتب',member:'عضو مكتب'};
const PERM={fin:['president','admin','treasurer'],prj:['president','admin','treasurer'],mem:['president','admin','secretary'],act:['president','admin','secretary'],arc:['president','admin','secretary','treasurer'],set:['president','admin']};

/* ============ الحالة والتخزين ============ */
const S={cfg:{},res:[],dep:[],mem:[],act:[],prj:[],doc:[],log:[],usr:[]};
const TABLES=['res','dep','mem','act','prj','doc','usr'];
let H=null,USER=null,DL=null,ME={id:'local',name:'',owner:true,role:'president'},READY=false,PG='dash',F={};
const CF=()=>Object.assign({},CFG0,S.cfg);
const C=k=>(S.cfg.cats&&S.cfg.cats[k]&&S.cfg.cats[k].length)?S.cfg.cats[k]:CATS0[k];
const live=t=>S[t].filter(x=>!x.del);
const can=m=>PERM[m].includes(ME.role);
function lsGet(k){try{return JSON.parse(localStorage.getItem('anfed_'+k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('anfed_'+k,JSON.stringify(v))}catch(e){}}
function errMsg(e){return e&&e.code==='invalid_argument'?'تعذر الحفظ: لا تملك صلاحية الكتابة أو أن الملف المرفق كبير جدًا':'تعذر الحفظ ('+(e&&(e.code||e.message))+')'}
async function put(t,rec,lg){
  const prev=S[t].find(x=>x.id===rec.id);rec.id=rec.id||uid();rec.upd=Date.now();rec.by=ME.id;
  const i=S[t].findIndex(x=>x.id===rec.id);if(i<0)S[t].push(rec);else S[t][i]=rec;
  try{if(H)await H.collection(t).doc(rec.id).set(rec);else lsSet(t,S[t]);if(lg)addLog(lg[0],lg[1])}
  catch(e){toast(errMsg(e));if(prev){S[t][S[t].findIndex(x=>x.id===rec.id)]=prev}else S[t]=S[t].filter(x=>x.id!==rec.id)}
  render();
}
async function softDel(t,id,what){const r=S[t].find(x=>x.id===id);if(!r)return;if(!confirm('تأكيد الإلغاء؟ تبقى العملية محفوظة في سجل العمليات.'))return;await put(t,{...r,del:true,delAt:today()},['إلغاء',what])}
async function addLog(a,d){const rec={id:uid(),ts:Date.now(),uid:ME.id,a,d};S.log.unshift(rec);try{if(H)await H.collection('log').doc(rec.id).set(rec);else lsSet('log',S.log.slice(0,500))}catch(e){}}
async function saveCfg(patch,lg){const nc={...S.cfg,...patch,id:'main'};const prev=S.cfg;S.cfg=nc;try{if(H)await H.collection('cfg').doc('main').set(nc);else lsSet('cfg',nc);if(lg)addLog('إعدادات',lg)}catch(e){S.cfg=prev;toast(errMsg(e))}applyTheme();render()}
function applyTheme(){const c=CF();document.documentElement.style.setProperty('--p',c.primary);document.documentElement.style.setProperty('--a',c.accent);$('#hname').textContent=c.name;const l=$('#hlogo');if(c.logo){l.src=c.logo;l.style.display=''}else l.style.display='none'}

/* ============ الملفات والتنزيل ============ */
function compressImg(file,limit,maxDim=1000,mime='image/jpeg'){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{let dim=maxDim,q=.8;for(;;){const sc=Math.min(1,dim/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));const x=c.getContext('2d');if(mime==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);const d=c.toDataURL(mime,q);if(d.length<limit){URL.revokeObjectURL(u);return res(d)}if(dim<120){URL.revokeObjectURL(u);return rej(new Error('تعذر ضغط الصورة'))}if(mime==='image/jpeg'&&q>.45)q-=.1;else dim*=.8}};
 img.onerror=()=>rej(new Error('صورة غير صالحة'));img.src=u})}
function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('تعذر قراءة الملف'));r.readAsDataURL(file)})}
async function readAttach(file,limit=185000){if(file.type.startsWith('image/'))return{name:file.name,type:'image/jpeg',data:await compressImg(file,limit)};const d=await readB64(file);if(d.length>limit)throw new Error('الملف كبير؛ الحد الأقصى حوالي 130 كيلوبايت لغير الصور. قلّص حجمه أو التقط صورة له.');return{name:file.name,type:file.type,data:d}}
function dataBlob(d){const[h,b]=d.split(',');const m=/data:([^;]+)/.exec(h)[1];const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:m})}
async function dl(name,data){if(!DL){toast('التنزيل غير متاح في هذا العرض');return}try{await DL.save({filename:name,data})}catch(e){if(!e||e.code!=='declined')toast('تعذر التنزيل')}}

/* ============ نوافذ ونماذج ============ */
function modal(html,wide){const o=document.createElement('div');o.id='ov';o.innerHTML=`<div class="mdl${wide?' wide':''}">${html}</div>`;document.body.appendChild(o);o.close=()=>o.remove();o.addEventListener('mousedown',e=>{if(e.target===o)o.__dn=1});o.addEventListener('click',e=>{if(e.target===o&&o.__dn)o.close()});return o}
function fh(f,v){const id='f_'+f.k,val=v[f.k]??f.d??'',req=f.req?' required':'';let inp;
 if(f.t==='select')inp=`<select id="${id}"${req}><option value="">— اختر —</option>${J((f.o||[]).map(o=>{const ov=o.v??o,ol=o.l??o;return `<option value="${esc(ov)}"${ov==val?' selected':''}>${esc(ol)}</option>`}))}</select>`;
 else if(f.t==='textarea')inp=`<textarea id="${id}" rows="3">${esc(val)}</textarea>`;
 else if(f.t==='check')inp=`<input type="checkbox" id="${id}"${val?' checked':''}>`;
 else if(f.t==='file'||f.t==='photos'){const pv=f.t==='photos'?(val||[]):(val?[val]:[]);inp=`<input type="file" id="${id}"${f.t==='photos'?' multiple accept="image/*"':f.img?' accept="image/*"':''}><div class="fp" id="fp_${f.k}">${J(pv.map(p=>p.type&&p.type.startsWith('image')?`<img src="${p.data}">`:`<span class="tag">${esc(p.name)}</span>`))}</div>`}
 else inp=`<input id="${id}" type="${f.t||'text'}" value="${esc(val)}"${req}${f.t==='number'?' step="any" min="0"':''}${f.ro?' readonly':''}>`;
 return `<div class="fg${f.w?' w2':''}"><label for="${id}">${f.l}${f.req?' *':''}</label>${inp}</div>`}
function openForm({title,fields,val={},onSave,extra=''}){
 const m=modal(`<h3>${title}</h3><form id="ff"><div class="fgrid">${J(fields.map(f=>fh(f,val)))}</div>${extra}<div class="row"><button class="btn" id="fsave">حفظ</button><button type="button" class="btn sec" id="fx">إلغاء</button></div></form>`);
 const files={};
 fields.filter(f=>f.t==='file'||f.t==='photos').forEach(f=>{$('#f_'+f.k,m).onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;try{if(f.t==='photos'){const lim=f.max||4;if(fs.length>lim)toast('يُحتفظ بأول '+lim+' صور فقط');const out=[];for(const x of fs.slice(0,lim))out.push({name:x.name,type:'image/jpeg',data:await compressImg(x,Math.floor(180000/lim),900)});files[f.k]=out;$('#fp_'+f.k,m).innerHTML=J(out.map(p=>`<img src="${p.data}">`))}
  else{let a;if(f.photo)a={name:fs[0].name,type:'image/jpeg',data:await compressImg(fs[0],f.lim||60000,320)};else a=await readAttach(fs[0]);files[f.k]=a;$('#fp_'+f.k,m).innerHTML=a.type.startsWith('image')?`<img src="${a.data}">`:`<span class="tag">${esc(a.name)}</span>`}}catch(er){toast(er.message);e.target.value=''}}});

function editMem(id){if(!can('mem'))return noPerm();const old=id?S.mem.find(x=>x.id===id):{};

 d.innerHTML=`<div class="top">${c.logo?`<img src="${c.logo}">`:''}<div>${esc(c.name)}<br><span style="font-weight:400;font-size:10px">${esc(c.fr)}</span></div></div><img class="ph" ${m.photo?`src="${m.photo.data}"`:''}><div class="inf"><b class="n">${esc(m.name)}</b>رقم الانخراط: <b>${esc(m.no)}</b><br>الصفة: ${esc(m.type||'')}<br>سنة الانخراط: ${esc((m.join||'').slice(0,4))}<br>الصلاحية: ${fmtD(m.start)} → ${fmtD(m.end)}</div><div class="qr"></div><div class="sg">${c.sigImg?`<img src="${c.sigImg}">`:''}توقيع الرئيس</div><div class="bot"><i>${esc(c.tel||c.email||'')}</i><i>NOBough GESTION – ANFED</i></div>`;

async function cardCanvas(m){const b=document.createElement('div');b.style.cssText='position:fixed;left:-9999px;top:0';const e=cardEl(m);b.appendChild(e);document.body.appendChild(b);await sleep(200);try{return await html2canvas(e,{scale:2,backgroundColor:null,useCORS:true})}finally{b.remove()}}
async function cardsPDF(ms,fname){if(!window.html2canvas||!window.jspdf){toast('مكتبة PDF غير محمّلة');return}toast('جارٍ إعداد البطائق…');const{jsPDF}=window.jspdf;

/* ============ الإقلاع ============ */
async function boot(){
 USER=await cap('user');DL=await cap('downloads');H=await cap('db');
 if(USER){try{const m=await USER.me();ME.id=m.id||'anon';ME.name=m.name;ME.owner=m.isOwner}catch(e){}}
 ME.role=ME.owner?'president':'member';
 let first=0;const need=TABLES.length+2;const done=()=>{if(++first===need){afterLoad()}};
 if(H){
  const tm=setTimeout(()=>{if(!READY){toast('تعذّر الوصول إلى قاعدة البيانات بعد؛ ستُحدَّث البيانات عند توفر الاتصال');READY=true;render()}},10000);
  const seen={};const once=k=>{if(!seen[k]){seen[k]=1;done()}};
  H.doc('cfg/main').onSnapshot(s=>{S.cfg=s.exists?s.data():{};applyTheme();once('cfg');if(READY)render()},e=>once('cfg'));
  TABLES.forEach(t=>H.collection(t).onSnapshot(s=>{S[t]=s.docs.map(d=>({...d.data(),id:d.id}));if(t==='usr'&&READY)syncRole();once(t);if(READY)render()},e=>once(t)));
  H.collection('log').orderBy('ts','desc').limit(300).onSnapshot(s=>{S.log=s.docs.map(d=>({...d.data(),id:d.id}));once('log');if(READY&&PG==='set')render()},e=>once('log'));
  window.__tm=tm;
 }else{S.cfg=lsGet('cfg')||{};TABLES.forEach(t=>S[t]=lsGet(t)||[]);S.log=lsGet('log')||[];ME.role='president';afterLoad()}
}
function syncRole(){const mine=S.usr.find(u=>u.id===ME.id);if(mine&&ROLES[mine.role])ME.role=mine.role;else if(ME.owner)ME.role='president'}
async function afterLoad(){if(window.__tm)clearTimeout(window.__tm);
 if(H&&ME.id&&ME.id!=='anon'&&!S.usr.find(u=>u.id===ME.id)){const r=ME.owner?'president':'member';ME.role=r;try{await H.collection('usr').doc(ME.id).set({id:ME.id,role:r,since:today()})}catch(e){}}
 syncRole();applyTheme();READY=true;render();
 if(!S.cfg.secret&&can('set')){saveCfg({secret:uid()+uid()})}}
boot();
</script>
